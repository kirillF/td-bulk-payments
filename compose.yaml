services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: firm_payments
      POSTGRES_PASSWORD: local_only
      POSTGRES_DB: firm_payments
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firm_payments -d firm_payments"]
      interval: 2s
      timeout: 3s
      retries: 20
  service:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://firm_payments:local_only@postgres:5432/firm_payments
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
